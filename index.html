<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rootsapiens</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; background: #000; }
  #pad { position: fixed; inset: auto 0 0 0; height: 96px; display: none; justify-content: space-between; padding: 0 14px 14px; pointer-events: none; }
  #pad div { display: flex; gap: 12px; }
  #pad button { pointer-events: auto; width: 72px; height: 72px; border-radius: 50%; border: 2px solid #e9dcb688; background: #0008; color: #e9dcb6; font: 700 22px sans-serif; }
  @media (pointer: coarse) { #pad { display: flex; } }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="pad">
  <div><button data-k="ArrowLeft" aria-label="Left">&#9664;</button><button data-k="ArrowRight" aria-label="Right">&#9654;</button></div>
  <div><button data-k="KeyE" aria-label="Grab or open">E</button><button data-k="Space" aria-label="Jump">&#9650;</button></div>
</div>
<script>
'use strict';
// Rootsapiens - a side-scrolling puzzle-platformer. Story: Omega Valley, Issue One.
// Level 0 "The Kitchen Door": the cow that waits at the kitchen door every morning is not there; Joseph follows her out of the farm.
// Level 1 "The Village Road": through the village at dawn, past the Ravens' truck, over the church wall to the mountain path.
// No dialogue. Everything is drawn in code; no image or sound files. Add a level: push one more object into LEVELS.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1280, H = 720, GROUND = 600;
const C = { ink: '#141017', inkSoft: '#231c26', wood: '#3a2a22', straw: '#c9a24a', scarf: '#c8452f', skin: '#d9b08c', water: '#2c5f73', lamp: '#f6c873' };
// art: painted images in art/ (or inlined as ART_DATA in the published build); every draw falls back to shapes until its image has loaded
const ART = {};
for (const n of ['bg_far.jpg', 'joseph_walk.png', 'cow_walk.png', 'p_farmhouse.png', 'p_barn.png', 'p_house.png', 'p_church.png', 'p_truck.png', 'p_crate.png', 'p_tree.png', 'p_wall.png', 'p_gate.png']) {
  const im = new Image(); im.src = (window.ART_DATA && window.ART_DATA[n]) || 'art/' + n; ART[n.replace(/\.\w+$/, '')] = im;
}
const has = (n) => ART[n].complete && ART[n].naturalWidth > 0;
const prop = (n, x, bottom, w, h, f) => ctx.drawImage(f ? dark(n, f) : ART[n], x, bottom - h, w, h);
const shade = {};   // darkened copies, made once (a canvas filter on every frame is slow)
function dark(n, f) { const k = n + f; if (!shade[k]) { const im = ART[n], c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.filter = f; x.drawImage(im, 0, 0); shade[k] = c; } return shade[k]; }
const ground = (x, w) => ({ x, y: GROUND, w, h: 400, kind: 'ground' });
const steps = (x0, n, rise, end) => Array.from({ length: n }, (_, i) => ({ x: x0 + i * 100, y: GROUND - (i + 1) * rise, w: end - (x0 + i * 100), h: rise, kind: 'step' }));

// ---------------------------------------------------------------- levels
const LEVELS = [
  {
    name: 'Level 0  ·  The Kitchen Door', endLine: 'She knew where she was going.', width: 6000, startX: 230, endX: 4960,
    solids: [
      ground(-400, 3700), ground(3450, 3000), { x: -400, y: 0, w: 380, h: GROUND },
      { x: 1000, y: 540, w: 46, h: 60, kind: 'stone' },     // low wall: first jump
      { x: 1900, y: 350, w: 44, h: 250, kind: 'wall' },     // yard wall: needs the crate
      { x: 2480, y: 380, w: 470, h: 16, kind: 'loft' },     // hayloft floor
      { x: 2950, y: 380, w: 30, h: 220, kind: 'barndoor' }, // barn door, shut from outside
      ...steps(3900, 3, 40, 6500),
    ],
    crates: [{ x: 1420, y: GROUND - 70, w: 90, h: 70 }],
    ladders: [{ x: 2428, y: 380, w: 40, h: 220 }],
    gates: [{ x: 4500, y: 300, w: 24, h: 180 }],
    pits: [{ x: 3300, w: 150 }],
    lights: [],
    checkpoints: [230, 1080, 2020, 3160, 3820],
    animals: { goX: 4250, y: 480, list: [{ x: 4720, s: 1 }, { x: 4860, s: 0.9 }, { x: 5010, s: 1.05 }] },
    prints: [3480, 4480],
    decor() {
      // farmhouse with the lit kitchen door, and the rope with no cow on it
      if (has('p_farmhouse')) prop('p_farmhouse', 10, GROUND + 8, 640, 424);
      else { building(40, 520, 300, 120, C.inkSoft); win(400, GROUND - 210, 60); }
      ctx.fillStyle = has('p_farmhouse') ? 'rgba(0,0,0,0)' : C.lamp; ctx.fillRect(196, GROUND - 150, 74, 150); ctx.fillStyle = 'rgba(246,200,115,0.18)'; ctx.beginPath(); ctx.moveTo(196, GROUND); ctx.lineTo(270, GROUND); ctx.lineTo(420, GROUND + 60); ctx.lineTo(120, GROUND + 60); ctx.fill();
      ctx.strokeStyle = C.straw; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(310, GROUND - 60); ctx.quadraticCurveTo(350, GROUND - 6, 400, GROUND - 4); ctx.stroke();
      ctx.fillStyle = C.wood; ctx.fillRect(304, GROUND - 90, 10, 90);
      // barn: back wall, stalls, loft window, empty halter
      if (has('p_barn')) prop('p_barn', 2130, GROUND + 6, 920, 664, 'brightness(0.42)');
      else { ctx.fillStyle = '#2a2029'; ctx.fillRect(2200, GROUND - 400, 780, 400); ctx.beginPath(); ctx.moveTo(2170, GROUND - 400); ctx.lineTo(2590, GROUND - 560); ctx.lineTo(3010, GROUND - 400); ctx.fill(); ctx.fillStyle = '#e39a5a'; ctx.fillRect(2880, GROUND - 330, 70, 80); }
      ctx.fillStyle = C.wood; for (let i = 0; i < 4; i++) ctx.fillRect(2560 + i * 90, GROUND - 90, 8, 90); ctx.fillRect(2560, GROUND - 60, 278, 6);
      ctx.strokeStyle = C.straw; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(2700, GROUND - 60); ctx.lineTo(2700, GROUND - 22); ctx.stroke();
      ctx.fillStyle = C.straw; ctx.beginPath(); ctx.ellipse(2760, 372, 90, 26, 0, Math.PI, 0); ctx.fill();
    },
  },
  {
    name: 'Level 1  ·  The Village Road', endLine: 'I could hear the bells after I stopped seeing the animals.', width: 6400, startX: 140, endX: 5720,
    solids: [
      ground(-400, 7200), { x: -400, y: 0, w: 380, h: GROUND },
      { x: 700, y: 556, w: 150, h: 44, kind: 'stone' },        // fountain rim
      { x: 1500, y: 340, w: 60, h: 260, kind: 'wall' },        // stacked wagons block the street: needs the handcart
      { x: 1560, y: 340, w: 300, h: 260, kind: 'house' },      // roof 1
      { x: 2010, y: 340, w: 300, h: 260, kind: 'house' },      // roof 2 (alley between: ladder back up)
      { x: 3360, y: 490, w: 150, h: 110, kind: 'truck' },      // the Ravens' truck: bed
      { x: 3510, y: 430, w: 70, h: 170, kind: 'truck' },       // cab
      { x: 4250, y: 300, w: 40, h: 300, kind: 'wall' },        // churchyard wall
      ...steps(4700, 5, 40, 7000),
    ],
    crates: [{ x: 1180, y: GROUND - 70, w: 90, h: 70 }],
    ladders: [{ x: 1962, y: 340, w: 40, h: 260 }, { x: 4202, y: 300, w: 40, h: 300, rope: true }],
    gates: [],
    pits: [],
    // the truck's headlight sweeps the street: on/off cycle; stand behind a pillar while it is on
    lights: [{ x0: 2520, x1: 3330, on: 2.6, off: 2.6, covers: [{ x: 2730, w: 80 }, { x: 3020, w: 80 }], src: [3350, 520] }],
    checkpoints: [140, 960, 2400, 3620, 4400],
    animals: { goX: 4600, y: 400, list: [{ x: 5260, s: 1 }, { x: 5420, s: 0.9 }, { x: 5600, s: 1.05 }, { x: 5780, s: 0.8 }] },
    cat: { x: 4460, goX: 4330 },
    bell: { x: 4170, done: false },
    prints: [3700, 5200],
    decor() {
      // village houses with a few lit windows
      const hs = [[60, 300, 250, 90], [420, 240, 300, 70], [900, 360, 230, 110], [2380, 300, 260, 90], [2660, 420, 300, 80], [3000, 300, 240, 100]];
      hs.forEach(([x, w, h, r], i) => {
        if (has('p_house') && has('p_farmhouse')) { const n = i % 2 ? 'p_farmhouse' : 'p_house', im = ART[n], hh = h + r; prop(n, x, GROUND + 6, hh * im.width / im.height, hh, 'brightness(0.72)'); }
        else { building(x, w, h, r, '#2a2230'); win(x + 40, GROUND - h + 50, 44); if (w > 280) win(x + w - 90, GROUND - h + 50, 44); }
      });
      // fountain
      ctx.fillStyle = C.inkSoft; ctx.fillRect(765, 470, 20, 90); ctx.beginPath(); ctx.ellipse(775, 470, 40, 10, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(190,225,235,0.6)'; ctx.lineWidth = 2; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(775, 462); ctx.quadraticCurveTo(775 + s * 40, 470 + Math.sin(G.t * 3) * 2, 775 + s * 50, 552); ctx.stroke(); }
      // stacked wagons and the two roofs
      if (!has('p_crate')) { ctx.fillStyle = C.wood; for (let i = 0; i < 3; i++) { ctx.fillRect(1492, 350 + i * 86, 76, 60); ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(1508, 420 + i * 86, 14, 0, 7); ctx.arc(1552, 420 + i * 86, 14, 0, 7); ctx.stroke(); } }
      if (!has('p_house')) for (const x of [1560, 2010]) { ctx.fillStyle = '#3a2a2e'; ctx.beginPath(); ctx.moveTo(x - 10, 340); ctx.lineTo(x + 150, 300); ctx.lineTo(x + 310, 340); ctx.fill(); win(x + 60, 420, 50); win(x + 190, 420, 50); }
      // arcade pillars: the dark places to stand
      for (const c of L.lights[0].covers) { ctx.fillStyle = '#0c090f'; ctx.fillRect(c.x, 360, c.w, 240); ctx.fillRect(c.x - 14, 350, c.w + 28, 18); }
      // church: nave, tower, bell
      if (has('p_church')) { prop('p_church', 3690, GROUND + 6, 610, 560); return; }
      ctx.fillStyle = '#2a2230'; ctx.fillRect(3760, 330, 490, 270); ctx.beginPath(); ctx.moveTo(3740, 330); ctx.lineTo(4005, 210); ctx.lineTo(4270, 330); ctx.fill();
      ctx.fillRect(4130, 110, 110, 220); ctx.beginPath(); ctx.moveTo(4120, 110); ctx.lineTo(4185, 40); ctx.lineTo(4250, 110); ctx.fill(); ctx.fillRect(4182, 10, 6, 40); ctx.fillRect(4170, 22, 30, 6);
      ctx.fillStyle = '#e39a5a'; ctx.fillRect(4160, 150, 50, 70);
      ctx.save(); ctx.translate(4185, 160); ctx.rotate(Math.sin(G.t * 4) * (L.bell.done ? 0.5 * Math.max(0, 1 - (G.t - L.bell.t) / 6) : 0)); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(-16, 44); ctx.quadraticCurveTo(-14, 6, 0, 4); ctx.quadraticCurveTo(14, 6, 16, 44); ctx.fill(); ctx.restore();
      ctx.fillStyle = C.lamp; ctx.beginPath(); ctx.arc(3890, 420, 34, 0, 7); ctx.fill(); ctx.fillStyle = '#2a2230'; ctx.fillRect(3886, 386, 8, 68); ctx.fillRect(3856, 416, 68, 8);   // rose window
    },
  },
];

// ---------------------------------------------------------------- state
let L = null, solids = [], crates = [], gates = [];
const P = { x: 0, y: 0, w: 26, h: 64, vx: 0, vy: 0, face: 1, ground: false, state: 'idle', phase: 0, cp: 0, mant: null, lad: null };
const G = { t: 0, cam: 0, started: false, ended: 0, fade: 1, hint: 0, bellT: 0, go: false, splashT: 0, splashX: 0, dead: 0, caught: false, level: 0 };
function load(n) {
  G.level = n; L = LEVELS[n]; solids = L.solids;
  crates = L.crates.map((c) => ({ ...c, vy: 0 })); gates = L.gates.map((g) => ({ ...g, open: 0, hold: 0, opening: false }));
  for (const a of L.animals.list) { if (a.x0 === undefined) a.x0 = a.x; a.x = a.x0; }
  if (L.cat) { if (L.cat.x0 === undefined) L.cat.x0 = L.cat.x; L.cat.x = L.cat.x0; }
  if (L.bell) L.bell.done = false;
  Object.assign(P, { x: L.startX, y: GROUND - P.h, vx: 0, vy: 0, face: 1, state: 'idle', cp: 0, ground: true });
  Object.assign(G, { ended: 0, fade: 1, hint: 0, go: false, dead: 0, caught: false, cam: 0, splashT: 0 });
}
const keys = {};
const press = (k, v) => {
  keys[k] = v;
  if (v && !G.started) { G.started = true; audio(); }
  if (v && G.ended > 4.5 && G.level + 1 < LEVELS.length) load(G.level + 1);
};
addEventListener('keydown', (e) => { if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); if (!e.repeat) press(e.code, true); });
addEventListener('keyup', (e) => press(e.code, false));
for (const b of document.querySelectorAll('#pad button')) {
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); press(b.dataset.k, true); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => press(b.dataset.k, false));
}
const left = () => keys.ArrowLeft || keys.KeyA, right = () => keys.ArrowRight || keys.KeyD;
const up = () => keys.ArrowUp || keys.KeyW, down = () => keys.ArrowDown || keys.KeyS;
const jump = () => keys.Space || keys.ArrowUp || keys.KeyW, grab = () => keys.KeyE || keys.ShiftLeft || keys.ShiftRight;

// ---------------------------------------------------------------- sound (synthesised)
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { AC = null; } } }
function tone(f, dur, vol, type = 'sine') {
  if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
}
function noise(dur, vol, freq) {
  if (!AC) return; const n = AC.sampleRate * dur, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(AC.destination); s.start();
}
const bell = (v = 1) => { tone(523, 1.6, 0.10 * v); tone(1046, 1.1, 0.05 * v); tone(1570, 0.7, 0.025 * v); };
const bigBell = () => { tone(196, 3.5, 0.22); tone(392, 2.6, 0.10); tone(588, 1.8, 0.05); };
const step = () => noise(0.06, 0.05, 900);
const splash = () => noise(0.5, 0.25, 1400);

// ---------------------------------------------------------------- physics
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function walls() { const s = solids.slice(); for (const g of gates) if (g.open < 1) s.push({ x: g.x, y: g.y - g.open * 170, w: g.w, h: g.h, kind: 'gate' }); return s; }
function moveX(o, dx, list) {
  o.x += dx;
  for (const s of list) if (s !== o && hit(o, s)) { if (dx > 0) o.x = s.x - o.w; else if (dx < 0) o.x = s.x + s.w; return s; }
  return null;
}
function moveY(o, dy, list) {
  o.y += dy;
  for (const s of list) if (s !== o && hit(o, s)) { if (dy > 0) { o.y = s.y - o.h; return 'floor'; } o.y = s.y + s.h; return 'ceil'; }
  return null;
}
/** top of the walkable ground at x (for decoration and for the cat) */
function topAt(x) { let y = GROUND; for (const s of solids) if ((s.kind === 'ground' || s.kind === 'step') && x >= s.x && x < s.x + s.w) y = Math.min(y, s.y); return y; }
const inPit = (x) => L.pits.some((p) => x > p.x && x < p.x + p.w);
function lightOn(l) { const c = (G.t % (l.on + l.off)); return c > l.off; }
function respawn() { P.x = L.checkpoints[P.cp]; P.y = GROUND - P.h - 2; P.vx = P.vy = 0; P.state = 'idle'; G.dead = 0; G.caught = false; G.fade = 1; }

function update(dt) {
  G.t += dt;
  if (!G.started) return;
  G.fade = Math.max(0, G.fade - dt * 0.9);
  G.hint += dt;
  if (G.ended) { G.ended += dt; animals(dt); return; }
  if (G.dead) { G.dead += dt; if (G.dead > 0.9) respawn(); return; }
  const stat = walls();
  for (const c of crates) { c.vy += 2200 * dt; if (moveY(c, c.vy * dt, stat.concat(crates))) c.vy = 0; }

  if (P.state === 'mantle') {            // pulling himself up a ledge
    const m = P.mant; m.t += dt / 0.42; const k = Math.min(1, m.t), e = k * k * (3 - 2 * k);
    P.x = m.x0 + (m.x1 - m.x0) * Math.max(0, (e - 0.5) * 2); P.y = m.y0 + (m.y1 - m.y0) * Math.min(1, e * 2);
    if (k >= 1) { P.state = 'idle'; P.vx = P.vy = 0; P.ground = true; }
    return after(dt);
  }
  const dir = (right() ? 1 : 0) - (left() ? 1 : 0);
  if (dir) P.face = dir;

  // ladders and ropes
  const mid = P.x + P.w / 2;
  const lz = L.ladders.find((l) => mid > l.x && mid < l.x + l.w && P.y + P.h > l.y - 2 && P.y < l.y + l.h);
  if (P.state !== 'ladder' && lz && (up() || (down() && !P.ground))) { P.state = 'ladder'; P.lad = lz; P.vx = P.vy = 0; P.x = lz.x + lz.w / 2 - P.w / 2; }
  if (P.state === 'ladder') {
    const l = P.lad, v = (down() ? 1 : 0) - (up() ? 1 : 0);
    P.y += v * 150 * dt; P.phase += Math.abs(v) * dt * 9;
    if (P.y + P.h < l.y + 2) P.y = l.y - P.h - 2;                          // top: level with the floor beside it
    if (P.y + P.h >= GROUND) { P.y = GROUND - P.h; P.state = 'idle'; }
    if (dir && (P.y + P.h <= l.y + 4 || P.y + P.h >= GROUND - 4)) { P.state = 'idle'; P.vy = 0; }
    else if (keys.Space && dir) { P.state = 'idle'; P.vy = -420; }
    if (P.state === 'ladder') return after(dt);
  }

  // run / push / pull
  const near = (c) => Math.abs((P.y + P.h) - (c.y + c.h)) < 6 && ((P.x + P.w <= c.x + 2 && c.x - (P.x + P.w) < 10) || (P.x >= c.x + c.w - 2 && P.x - (c.x + c.w) < 10));
  const held = grab() && P.ground ? crates.find(near) : null;
  const speed = held ? 120 : 280;
  P.vx += (dir * speed - P.vx) * Math.min(1, dt * (P.ground ? 14 : 6));
  const others = stat.concat(crates), px0 = P.x;
  const blocked = moveX(P, P.vx * dt, others);
  if (held && dir && Math.sign(dir) !== Math.sign(held.x - P.x)) moveX(held, P.x - px0, stat.concat(crates));   // walking away while holding: it follows
  if (blocked && crates.includes(blocked) && P.ground && dir) {   // walking into a crate pushes it
    const b = blocked.x; moveX(blocked, dir * 110 * dt, stat.concat(crates)); P.x += blocked.x - b; P.vx = dir * 110;
  }
  // jump
  if (jump() && P.ground && !P.jumpHeld) { P.vy = -760; P.ground = false; P.jumpHeld = true; step(); }
  if (!jump()) P.jumpHeld = false;
  if (P.vy < 0 && !jump()) P.vy += 2600 * dt;               // short hop when the key is let go
  P.vy = Math.min(1400, P.vy + 2200 * dt);
  const fy = moveY(P, P.vy * dt, others);
  const wasGround = P.ground; P.ground = fy === 'floor';
  if (fy) { if (P.ground && !wasGround && P.vy > 500) step(); P.vy = 0; }

  // ledge grab: in the air, pressing into a wall whose top is at head height
  if (!P.ground && dir && P.vy > -300 && blocked && !crates.includes(blocked) && blocked.kind !== 'gate') {
    const top = blocked.y;
    if (top > P.y - 12 && top < P.y + 36) {
      const tx = dir > 0 ? blocked.x + 4 : blocked.x + blocked.w - P.w - 4, probe = { x: tx, y: top - P.h - 1, w: P.w, h: P.h };
      if (!others.some((s) => s !== blocked && hit(probe, s))) { P.state = 'mantle'; P.mant = { t: 0, x0: P.x, y0: P.y, x1: tx, y1: top - P.h }; P.vx = P.vy = 0; }
    }
  }
  // gates: hold E next to one
  for (const g of gates) {
    if (g.open < 1 && Math.abs(mid - g.x) < 110 && P.ground && grab()) { g.hold += dt; if (g.hold > 1.1) g.opening = true; } else if (!g.opening) g.hold = Math.max(0, g.hold - dt * 2);
    if (g.opening && g.open < 1) { g.open = Math.min(1, g.open + dt * 0.9); if (g.open >= 1) noise(0.2, 0.12, 500); }
  }
  if (P.state !== 'mantle') P.state = !P.ground ? 'air' : held && dir ? 'pull' : Math.abs(P.vx) > 20 ? 'run' : 'idle';
  if (P.state === 'run' || P.state === 'pull') { const o = P.phase; P.phase += Math.abs(P.vx) * dt * 0.045; if (Math.floor(o / Math.PI) !== Math.floor(P.phase / Math.PI)) step(); }
  after(dt);
}
function after(dt) {
  const mid = P.x + P.w / 2;
  for (let i = P.cp + 1; i < L.checkpoints.length; i++) if (P.x > L.checkpoints[i]) P.cp = i;
  if (P.y > GROUND + 30 && !G.dead) { G.dead = 0.01; G.splashT = 0.01; G.splashX = P.x; splash(); }
  if (G.splashT) { G.splashT += dt; if (G.splashT > 1) G.splashT = 0; }
  // the headlight: seen in the open while it is on = back to the last safe place
